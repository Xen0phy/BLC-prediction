<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Lion Chest — Rotation Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#17181a; --panel:#1d1f21; --panel2:#24272a;
    --line:#3a3d40; --line-soft:#2b2e30;
    --gold:#c9973f;
    --cream:#e9e1cf; --cream-dim:#a89e88;
    --long:#009900;
    --short:#c99a1f;
    --status-ok-bg:#132621;
    --status-err-bg:#2c1c12;
    --unknown:#8b7d55;
    --danger:#a5402f;
    --vintage:#a37fc9;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-display: var(--font-body);
    --font-num: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --fs-1: 10px;  /* micro: badges, tags, tiny labels */
    --fs-2: 11px;  /* secondary labels, meta text */
    --fs-3: 12px;  /* base UI text: buttons, hints, cell text */
    --fs-4: 13px;  /* body / table base text */
    --fs-5: 16px;  /* medium emphasis: tabs, set names */
    --fs-6: 18px;  /* section headings */
    --fs-7: 24px;  /* page title */
    --fs-8: 28px;  /* hero percentage number */
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--font-body);}
  .wrap{max-width:1500px;margin:0 auto;padding:28px 24px 60px;}
  .layout-grid{display:grid;grid-template-columns:1fr;gap:32px;align-items:start;}
  @media (min-width:980px){
    .layout-grid{grid-template-columns:320px 1fr;}
    .sidebar{position:sticky;top:20px;}
  }
  @media (max-width:979px){
    .layout-grid[data-tab="timeline"] .sidebar{display:none;}
  }
  .sidebar .predict-grid{grid-template-columns:1fr;}

  .masthead{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px;}
  .masthead h1{font-family:var(--font-display);font-size:var(--fs-7);font-weight:600;margin:0;color:var(--gold);}
  .masthead p{margin:4px 0 0;font-size:var(--fs-4);color:var(--cream-dim);}

  .ref-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:28px;font-size:var(--fs-3);}
  .ref-bar .field{display:flex;align-items:center;gap:6px;}
  .ref-bar label{color:var(--cream-dim);}
  .ref-bar input{background:var(--panel2);border:1px solid var(--line);color:var(--cream);border-radius:4px;padding:5px 8px;font-size:var(--fs-3);}
  .ref-bar .ref-date-value{background:var(--panel2);border:1px solid var(--line);color:var(--cream);border-radius:4px;padding:5px 10px;font-size:var(--fs-3);font-family:var(--font-num);}
  .ref-bar .note{color:var(--cream-dim);font-family:var(--font-num);}

  h2{font-family:var(--font-display);font-weight:600;font-size:var(--fs-6);color:var(--gold);margin:0 0 12px;}
  h3{font-family:var(--font-display);font-weight:600;font-size:var(--fs-5);color:var(--gold);margin:0 0 10px;}

  .tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--line);}
  .tab-btn{background:none;border:none;border-bottom:3px solid transparent;color:var(--cream-dim);padding:10px 18px 12px;font-size:var(--fs-5);font-family:var(--font-display);cursor:pointer;border-radius:6px 6px 0 0;transition:color .15s ease,background-color .15s ease;}
  .tab-btn:hover{color:var(--cream);background:var(--panel2);}
  .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);background:var(--panel);font-weight:600;}

  .timeline-divider{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;margin:14px 0 8px;}
  .timeline-divider.retired-toggle{cursor:pointer;}
  .timeline-divider.retired-toggle .divider-label{transition:color .15s ease;}
  .timeline-divider.retired-toggle:hover .divider-label{color:var(--cream-dim);}
  .timeline-divider .divider-label{font-size:var(--fs-2);color:var(--cream-dim);text-transform:uppercase;letter-spacing:0.8px;white-space:nowrap;}
  .timeline-divider .divider-arrow{display:inline-block;margin-right:4px;font-size:var(--fs-1);vertical-align:middle;position:relative;top:-1px;}
  .timeline-divider .divider-line{height:1px;background:var(--line);}
  .retired-toggle-row{cursor:pointer;}
  .retired-toggle-row h2{transition:color .15s ease;}
  .retired-toggle-row:hover h2{color:var(--gold);}
  .retired-toggle-row .divider-arrow{display:inline-block;margin-right:6px;font-size:var(--fs-3);color:var(--gold);vertical-align:middle;position:relative;top:-2px;}
  .timeline-row.is-retired .timeline-label{color:var(--cream-dim);}

  .predict-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:36px;}
  @media (max-width:640px){.predict-grid{grid-template-columns:1fr;}}
  .predict-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px;position:relative;}
  .predict-card::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--gold);}
  .predict-card.slot-short::before{background:var(--short);}
  .predict-card.slot-long::before{background:var(--long);}
  .slot-label{font-family:var(--font-num);font-size:var(--fs-2);text-transform:uppercase;letter-spacing:1.5px;display:flex;align-items:center;gap:7px;}
  .slot-label .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .slot-short .slot-label{color:var(--short);}
  .slot-short .slot-label .dot{background:var(--short);}
  .slot-long .slot-label{color:var(--long);}
  .slot-long .slot-label .dot{background:var(--long);}
  .slot-queue{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);}
  .slot-queue-title{font-size:var(--fs-2);text-transform:uppercase;letter-spacing:0.8px;color:var(--cream-dim);margin-bottom:6px;}
  .slot-queue-item{padding:5px 0;}
  .slot-queue-row{display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-3);color:var(--cream-dim);}
  .slot-queue-item b{color:var(--cream);font-weight:500;}
  .slot-queue-item .q-pct{font-family:var(--font-num);font-size:var(--fs-1);letter-spacing:0.3px;color:var(--cream-dim);white-space:nowrap;}
  .slot-queue-bar{margin-top:4px;}
  .predict-rank{font-family:var(--font-num);font-size:var(--fs-2);color:var(--cream-dim);text-transform:uppercase;letter-spacing:1.5px;}
  .predict-name{font-family:var(--font-display);font-size:var(--fs-6);font-weight:600;color:var(--cream);margin:4px 0 8px;}
  .predict-pct{font-family:var(--font-num);font-size:var(--fs-8);color:var(--gold);line-height:1;}
  .slot-short .predict-pct{color:var(--short);}
  .slot-long .predict-pct{color:var(--long);}
  .predict-pct span{font-size:var(--fs-3);color:var(--cream-dim);}
  .predict-meta{margin-top:10px;font-size:var(--fs-3);color:var(--cream-dim);line-height:1.6;}
  .predict-meta b{color:var(--cream);font-weight:600;}

  .type-tag{display:inline-flex;align-items:center;font-size:var(--fs-1);letter-spacing:0.5px;text-transform:uppercase;font-family:var(--font-num);line-height:1;}
  .type-long{color:var(--long);}
  .type-short{color:var(--short);}
  .type-unknown{color:var(--unknown);}
  .vintage-tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-1);letter-spacing:0.3px;text-transform:uppercase;font-family:var(--font-num);color:var(--vintage);white-space:nowrap;line-height:1;}
  .vintage-tag::before{content:"◆";font-size:8px;color:var(--vintage);position:relative;top:-1px;}
  .vintage-dash{color:var(--cream-dim);font-family:var(--font-num);}
  .timeline-dot.vintage{background:var(--vintage);border-radius:2px;transform:translate(-50%,-50%) rotate(45deg);width:8px;height:8px;}

  .timeline-controls{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 18px;margin-bottom:14px;}
  .control-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
  .range-slider-wrap{position:relative;height:30px;margin:6px 0;}
  .range-slider-base-track{position:absolute;top:50%;left:0;right:0;height:4px;background:var(--line-soft);transform:translateY(-50%);border-radius:2px;}
  .range-slider-fill{position:absolute;top:50%;height:4px;background:var(--gold);transform:translateY(-50%);border-radius:2px;}
  .range-slider-wrap input[type=range]{position:absolute;top:50%;left:0;width:100%;height:26px;transform:translateY(-50%);-webkit-appearance:none;appearance:none;background:transparent;margin:0;pointer-events:none;z-index:3;}
  .range-slider-wrap input[type=range]:focus{z-index:5;outline:none;}
  .range-slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:8px;height:26px;border-radius:3px;background:var(--gold);border:1.5px solid var(--bg);cursor:grab;margin-top:-11px;}
  .range-slider-wrap input[type=range]::-webkit-slider-runnable-track{background:transparent;height:4px;}
  .range-slider-wrap input[type=range]::-moz-range-thumb{pointer-events:auto;width:8px;height:26px;border-radius:3px;background:var(--gold);border:1.5px solid var(--bg);cursor:grab;}
  .range-slider-wrap input[type=range]::-moz-range-track{background:transparent;height:4px;}
  .range-slider-wrap input[type=range]:active::-webkit-slider-thumb{background:var(--gold);cursor:grabbing;}
  .range-slider-wrap input[type=range]:active::-moz-range-thumb{background:var(--gold);cursor:grabbing;}
  .range-slider-labels{display:flex;justify-content:space-between;font-size:var(--fs-2);color:var(--cream-dim);font-family:var(--font-num);}
  .timeline-block{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px 20px;margin-bottom:32px;overflow-x:auto;}
  .timeline-row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .timeline-row:last-child{border-bottom:none;}
  .timeline-row:hover .timeline-label{color:var(--gold);}
  .timeline-label{font-size:var(--fs-3);color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .timeline-track{position:relative;height:20px;min-width:420px;}
  .timeline-track .axis-line{position:absolute;top:50%;left:0;right:0;height:1px;background:var(--line-soft);}
  .timeline-dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);border:1.5px solid var(--bg);}
  .timeline-dot.long{background:var(--long);}
  .timeline-dot.short{background:var(--short);}
  .timeline-dot.unknown{background:var(--unknown);}
  .timeline-dot.predicted{background:transparent;border:1.5px dashed var(--gold);width:11px;height:11px;}
  .timeline-dot.predicted.long{border-color:var(--long);}
  .timeline-dot.predicted.short{border-color:var(--short);}
  .timeline-dot.predicted.unknown{border-color:var(--unknown);}
  .timeline-connector{position:absolute;top:50%;height:2px;transform:translateY(-50%);}
  .timeline-connector.long{background:var(--long);}
  .timeline-connector.short{background:var(--short);}
  .timeline-connector.unknown{background:var(--unknown);}
  .timeline-connector.to-predicted{height:0;border-top:2px dashed;background:none;}
  .timeline-connector.to-predicted.long{border-color:var(--long);}
  .timeline-connector.to-predicted.short{border-color:var(--short);}
  .timeline-connector.to-predicted.unknown{border-color:var(--unknown);}
  .timeline-refline{position:absolute;top:-2px;bottom:-2px;width:1px;z-index:1;}
  .timeline-refline.today{background:var(--cream-dim);}
  .timeline-refline.next-update{background:var(--gold);}
  .timeline-yearline{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line-soft);z-index:0;}
  .timeline-year-header{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-bottom:2px;}
  .timeline-year-track{position:relative;height:14px;}
  .timeline-year-label{position:absolute;top:0;font-size:var(--fs-1);color:var(--cream-dim);font-family:var(--font-num);transform:translateX(-50%);white-space:nowrap;}
  .timeline-header{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-bottom:6px;}
  .timeline-header .legend{display:flex;gap:16px;font-size:var(--fs-2);color:var(--cream-dim);align-items:center;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:5px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;}
  .hint{font-size:var(--fs-3);color:var(--cream-dim);}

  table.roster{width:100%;border-collapse:collapse;font-size:var(--fs-4);margin-bottom:8px;}
  table.roster th{text-align:left;font-size:var(--fs-2);text-transform:uppercase;letter-spacing:0.5px;color:var(--cream-dim);font-weight:400;padding:6px 10px;border-bottom:1px solid var(--line);}
  table.roster td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  table.roster tr:hover td{background:rgba(201,151,63,0.04);}
  td.num{font-family:var(--font-num);color:var(--cream-dim);}
  td.name{color:var(--cream);font-weight:500;cursor:pointer;}
  td.name:hover{color:var(--gold);text-decoration:underline;}
  th.check-col,td.check-col{width:30px;padding-right:0;text-align:center;}
  td.check-col{cursor:pointer;}
  input.collected-check{width:15px;height:15px;cursor:pointer;accent-color:var(--gold);vertical-align:middle;background:var(--panel2);border:1px solid var(--line);border-radius:2px;}
  tr.is-collected td{opacity:0.5;}
  tr.is-collected td.name{text-decoration:line-through;}
  .pct-bar-wrap{display:flex;align-items:center;gap:8px;}
  .pct-bar-track{flex:1;height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;min-width:50px;}

  .coin{font-family:var(--font-num);white-space:nowrap;}
  .coin .g{color:var(--gold);}
  .coin .s{color:#c9c9c9;}
  .coin .c{color:#c9793f;}
  .coin.dim{color:var(--cream-dim);}
  td.price{font-family:var(--font-num);font-size:var(--fs-3);line-height:1.5;}
  td.price .lbl{color:var(--cream-dim);font-size:var(--fs-1);text-transform:uppercase;letter-spacing:0.4px;margin-right:4px;}
  .price-summary{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:14px;font-size:var(--fs-3);}
  .price-summary-grid{display:grid;grid-template-columns:1fr 1fr 2fr;gap:20px;}
  @media (max-width:640px){.price-summary-grid{grid-template-columns:1fr;gap:12px;}}
  .ps-col{display:flex;flex-direction:column;gap:3px;border-left:2px solid var(--line-soft);padding-left:10px;}
  .ps-col:first-child{border-left:none;padding-left:0;}
  .ps-col-cheapest{justify-content:center;}
  .ps-title{font-size:var(--fs-2);text-transform:uppercase;letter-spacing:0.6px;color:var(--gold);margin-bottom:2px;}
  .ps-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .ps-lbl{color:var(--cream-dim);text-transform:uppercase;font-size:var(--fs-2);letter-spacing:0.5px;min-width:78px;}
  .ps-col-cheapest .ps-lbl{min-width:88px;}
  .ps-col-cheapest b{color:var(--cream);font-weight:500;}
  .price-summary .note{color:var(--cream-dim);font-family:var(--font-body);display:block;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);}
  .price-incomplete{color:var(--unknown);font-size:var(--fs-1);margin-left:4px;}
  .pct-bar-fill{height:100%;background:var(--gold);}
  .pct-bar-fill.type-long{background:var(--long);}
  .pct-bar-fill.type-short{background:var(--short);}
  .pct-num{display:inline-flex;align-items:center;justify-content:flex-end;font-family:var(--font-num);font-size:var(--fs-1);letter-spacing:0.3px;color:var(--gold);min-width:38px;}
  .pct-num.type-long{color:var(--long);}
  .pct-num.type-short{color:var(--short);}

  .detail-panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;margin:6px 0 16px;padding:14px 16px;font-size:var(--fs-3);}
  .detail-panel .detail-row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:10px;color:var(--cream-dim);}
  .detail-panel .detail-row b{color:var(--cream);font-weight:600;}
  .chip-list{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 9px;font-size:var(--fs-3);font-family:var(--font-num);color:var(--cream-dim);}

  button{font-family:var(--font-body);font-size:var(--fs-3);cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--cream-dim);padding:5px 10px;}
  button:hover{border-color:var(--gold);color:var(--cream);}
  button.small{padding:2px 7px;font-size:var(--fs-2);}

  .footnote{font-size:var(--fs-2);color:var(--cream-dim);line-height:1.6;margin-top:6px;}
  .status-msg{font-size:var(--fs-3);padding:8px 10px;border-radius:4px;margin-bottom:14px;display:none;}
  .status-msg.show{display:block;}
  .status-ok{background:var(--status-ok-bg);color:var(--long);}
  .status-err{background:var(--status-err-bg);color:var(--short);}
  .loading{padding:60px 0;text-align:center;color:var(--cream-dim);font-size:var(--fs-4);}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <h1>Black Lion Chest — Rotation Predictor</h1>
      <p>Read-only view, sourced live from data.json.</p>
    </div>
  </div>
  <div id="app"><div class="loading">Loading rotation data…</div></div>
</div>

<script>
const REFDATE_KEY = 'blc-refdate';
const COLLECTED_KEY = 'blc-collected';
const CUTOFF = new Date('2021-11-09T00:00:00Z');
const DAY = 86400000;
let sets = [];
let nextUpdateDate = null;
let expandedName = null;
let activeTab = 'list';
let dataLoadError = null;
let rangeStart = null;
let rangeEnd = null;
let foldRetired = true;
let listShowRetired = false;
let skinIds = {};
let prices = {};
let pricesStatus = 'idle'; // idle | loading | loaded | error
let pricesErrorMsg = null;
let pricesUpdatedAt = null;
let shamanStatus = 'idle'; // idle | loading | loaded | error
let collectedSets = new Set();
function switchTab(tab){ activeTab = tab; render(); }

function toUTC(iso){ return new Date(iso + 'T00:00:00Z'); }
function daysBetween(a,b){ return Math.round((b-a)/DAY); }
function fmtDisplay(d){ return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}); }
function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function stdev(arr){ if(arr.length<2) return 0; const m=mean(arr); return Math.sqrt(mean(arr.map(x=>(x-m)**2))); }
function median(arr){
  const a=arr.slice().sort((x,y)=>x-y); const n=a.length;
  return n%2 ? a[(n-1)/2] : (a[n/2-1]+a[n/2])/2;
}
// Median + scaled MAD: a robust "center and spread" pair, resistant to the
// outliers a set unexpectedly overstaying its slot creates in mean/stdev.
function robustSpread(arr){
  const m=median(arr);
  const mad=median(arr.map(x=>Math.abs(x-m)));
  return 1.4826*mad; // scale factor makes MAD comparable to stdev for a normal distribution
}
function sigmoid(z){ return 1/(1+Math.exp(-z)); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function todayUTC(){ const n=new Date(); return new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(str){ return String(str).replace(/'/g, "\\'"); }
function fmtISO(d){ return d.toISOString().slice(0,10); }

async function fetchSets(){
  const res = await fetch('./data.json', {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}

async function loadSets(){
  try{
    const fresh = await fetchSets();
    sets = fresh.map(s=>({
      name: s.name, added: s.added, appearances: s.appearances||[],
      retired: !!s.retired, type: s.type ?? null, vintage: s.vintage || null
    }));
    dataLoadError = null;
  }catch(e){
    dataLoadError = e.message || 'fetch failed';
    sets = [];
  }
}

async function fetchSkinIds(){
  const res = await fetch('./skin-ids.json', {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return await res.json();
}

async function loadSkinIds(){
  try{ skinIds = await fetchSkinIds(); }
  catch(e){ skinIds = {}; }
}

function copperToParts(copper){
  copper = Math.round(copper||0);
  const g = Math.floor(copper/10000);
  const s = Math.floor((copper%10000)/100);
  const c = copper%100;
  return {g,s,c};
}
function coinHtml(copper){
  const {g,s,c} = copperToParts(copper);
  return `<span class="coin"><span class="g">${g}g</span> <span class="s">${s}s</span> <span class="c">${c}c</span></span>`;
}

async function loadPrices(){
  if(pricesStatus==='loading') return;
  pricesStatus = 'loading';
  pricesErrorMsg = null;
  render();
  try{
    const allIds = Array.from(new Set(Object.values(skinIds).flat()));
    if(allIds.length===0) throw new Error('no skin IDs loaded (skin-ids.json missing or empty)');
    const priceMap = {};
    const chunkSize = 150;
    for(let i=0;i<allIds.length;i+=chunkSize){
      const chunk = allIds.slice(i, i+chunkSize);
      const res = await fetch(`https://api.guildwars2.com/v2/commerce/prices?ids=${chunk.join(',')}`);
      if(res.status===404){ continue; } // none in this chunk are currently listed
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      data.forEach(d=>{ priceMap[d.id] = d; });
    }
    const result = {};
    Object.entries(skinIds).forEach(([name, ids])=>{
      let buy=0, sell=0, missing=0;
      ids.forEach(id=>{
        const d = priceMap[id];
        if(d && d.buys){ buy += d.buys.unit_price; } else { missing++; }
        if(d && d.sells){ sell += d.sells.unit_price; } else { missing++; }
      });
      result[name] = {buy, sell, missing, count: ids.length};
    });
    prices = result;
    pricesStatus = 'loaded';
    pricesUpdatedAt = new Date();
  }catch(e){
    pricesStatus = 'error';
    pricesErrorMsg = e.message || 'fetch failed';
  }
  render();
}

function loadRefDate(){
  try{ nextUpdateDate = localStorage.getItem(REFDATE_KEY) || null; }
  catch(e){ nextUpdateDate = null; }
}
function saveRefDate(){
  try{
    if(nextUpdateDate) localStorage.setItem(REFDATE_KEY, nextUpdateDate);
    else localStorage.removeItem(REFDATE_KEY);
  }catch(e){ showStatus('Could not save the reference date locally (storage blocked).', true); }
}
function loadCollected(){
  try{
    const raw = localStorage.getItem(COLLECTED_KEY);
    collectedSets = new Set(raw ? JSON.parse(raw) : []);
  }catch(e){ collectedSets = new Set(); }
}
function saveCollected(){
  try{ localStorage.setItem(COLLECTED_KEY, JSON.stringify(Array.from(collectedSets))); }
  catch(e){ showStatus('Could not save collected sets locally (storage blocked).', true); }
}
function toggleCollected(name, evt){
  if(evt) evt.stopPropagation();
  if(collectedSets.has(name)) collectedSets.delete(name);
  else collectedSets.add(name);
  saveCollected();
  render();
}
function showStatus(msg, isErr){
  const el = document.getElementById('status-msg');
  if(!el) return;
  el.textContent = msg;
  el.className = 'status-msg show ' + (isErr?'status-err':'status-ok');
  setTimeout(()=>el.classList.remove('show'), 3500);
}

function computeGlobalStats(){
  const longGaps=[], shortGaps=[];
  let longCount=0, shortCount=0;
  const debutEntries=[]; // {added, type, d}: one entry per set's first-ever BLC appearance
  for(const s of sets){
    const app=(s.appearances||[]).map(toUTC).sort((a,b)=>a-b);
    if(app.length && s.added){
      const added=toUTC(s.added);
      const d=daysBetween(added, app[0]);
      if(d>0 && app[0]>=CUTOFF){
        debutEntries.push({added, type:s.type, d});
      }
    }
    if(app.length<2) continue;
    if(app[0]<CUTOFF) continue;
    const gaps=[]; for(let i=1;i<app.length;i++) gaps.push(daysBetween(app[i-1],app[i]));
    if(s.type==='long'){ longGaps.push(...gaps); longCount++; }
    else if(s.type==='short'){ shortGaps.push(...gaps); shortCount++; }
  }
  debutEntries.sort((a,b)=>a.added-b.added);

  // Debut delay (added -> first appearance) has tightened since 2019-2021
  // (600-800+ days then; ~150-190d Rare / ~280-360d Uncommon now), so
  // averaging all history overstates uncertainty. A trailing window of
  // recent debuts, via median + robust MAD, tracks current cadence without
  // getting skewed by one overstaying set delaying the next debut.
  const DEBUT_WINDOW = 8;
  function debutStats(filterFn){
    const vals = debutEntries.filter(filterFn).slice(-DEBUT_WINDOW).map(e=>e.d);
    if(vals.length===0) return null;
    if(vals.length<4) return {mean:mean(vals), std:null};
    return {mean:median(vals), std:robustSpread(vals)};
  }

  const longMean = longGaps.length? mean(longGaps):353;
  const longStd = Math.max(20, longGaps.length>3? stdev(longGaps):28);
  const shortMean = shortGaps.length? mean(shortGaps):179;
  const shortStd = Math.max(20, shortGaps.length>3? stdev(shortGaps):39);
  const totalTyped = longCount+shortCount;
  const priorLong = totalTyped? longCount/totalTyped : 0.6;
  const priorShort = 1-priorLong;
  const debutAllStats = debutStats(()=>true) || {mean:380, std:null};
  const debutMean = debutAllStats.mean;
  const debutStd = Math.max(40, debutAllStats.std ?? 150);
  const debutLongStats = debutStats(e=>e.type==='long') || {mean:debutMean, std:null};
  const debutLongMean = debutLongStats.mean;
  const debutLongStd = Math.max(40, debutLongStats.std ?? debutStd);
  const debutShortStats = debutStats(e=>e.type==='short') || {mean:debutMean, std:null};
  const debutShortMean = debutShortStats.mean;
  const debutShortStd = Math.max(40, debutShortStats.std ?? debutStd);
  return {longMean,longStd,shortMean,shortStd,priorLong,priorShort,debutMean,debutStd,debutLongMean,debutLongStd,debutShortMean,debutShortStd};
}

function predictSet(s, stats, refDate){
  const app=(s.appearances||[]).map(toUTC).sort((a,b)=>a-b);
  if(app.length===0){
    const added=toUTC(s.added);
    const type = s.type || 'unknown';
    let dMean=stats.debutMean, dStd=stats.debutStd;
    if(type==='long'){ dMean=stats.debutLongMean; dStd=stats.debutLongStd; }
    else if(type==='short'){ dMean=stats.debutShortMean; dStd=stats.debutShortStd; }
    const predicted=new Date(added.getTime()+dMean*DAY);
    const z=daysBetween(predicted, refDate)/dStd;
    return {score:sigmoid(z), type, count:0, lastDate:null, predicted, daysDiff:daysBetween(predicted,refDate)};
  }
  const last=app[app.length-1];
  if(app.length===1){
    let type = s.type || 'unknown';
    let predicted, std;
    if(type==='long'){ predicted=new Date(last.getTime()+stats.longMean*DAY); std=stats.longStd; }
    else if(type==='short'){ predicted=new Date(last.getTime()+stats.shortMean*DAY); std=stats.shortStd; }
    else{
      const blendGap = stats.priorLong*stats.longMean+stats.priorShort*stats.shortMean;
      std = Math.sqrt(stats.priorLong*stats.longStd**2+stats.priorShort*stats.shortStd**2);
      predicted = new Date(last.getTime()+blendGap*DAY);
    }
    const z=daysBetween(predicted, refDate)/Math.max(20,std);
    return {score:sigmoid(z), type, count:1, lastDate:last, predicted, daysDiff:daysBetween(predicted,refDate)};
  }
  const gaps=[]; for(let i=1;i<app.length;i++) gaps.push(daysBetween(app[i-1],app[i]));
  const ownAvg=mean(gaps);
  const type = s.type || 'unknown';
  const typeMean = type==='long' ? stats.longMean : type==='short' ? stats.shortMean : (stats.priorLong*stats.longMean+stats.priorShort*stats.shortMean);
  const typeStd = type==='long' ? stats.longStd : type==='short' ? stats.shortStd : Math.sqrt(stats.priorLong*stats.longStd**2+stats.priorShort*stats.shortStd**2);
  const ownWeight = clamp(gaps.length/3,0,1);
  const expectedGap = ownWeight*ownAvg+(1-ownWeight)*typeMean;
  const predicted=new Date(last.getTime()+expectedGap*DAY);
  const z=daysBetween(predicted, refDate)/typeStd;
  return {score:sigmoid(z), type, count:app.length, lastDate:last, predicted, daysDiff:daysBetween(predicted,refDate)};
}

function getRefDate(){ return nextUpdateDate ? toUTC(nextUpdateDate) : todayUTC(); }

function buildPredictions(){
  const stats = computeGlobalStats();
  const refDate = getRefDate();
  const active = sets.filter(s=>!s.retired);
  const scored = active.map(s=>({s, p:predictSet(s, stats, refDate)}));
  // Only one long and one short set occupy the chest at a time, so normalize
  // each type's candidates against its own peers, not pooled together.
  ['long','short'].forEach(t=>{
    const pool = scored.filter(x=>x.p.type===t);
    const totalScore = pool.reduce((a,b)=>a+b.p.score,0)||1;
    pool.forEach(x=>x.pct = x.p.score/totalScore*100);
  });
  scored.filter(x=>x.p.type!=='long' && x.p.type!=='short').forEach(x=>{ x.pct = 0; });
  // barPct is a purely visual scale relative to the highest pct across both
  // slots, so bar length is comparable at a glance (40% overall max = full bar).
  const globalMaxPct = Math.max(...scored.map(x=>x.pct), 0.0001);
  scored.forEach(x=>{ x.barPct = x.pct/globalMaxPct*100; });
  return {scored, stats, refDate};
}

function typeTag(type){
  if(type==='long') return '<span class="type-tag type-long">Uncommon</span>';
  if(type==='short') return '<span class="type-tag type-short">Rare</span>';
  return '<span class="type-tag type-unknown">unknown</span>';
}

  if(ranked.length===0){
    return `<div class="predict-card slot-${typeKey}">
      <div class="slot-label"><span class="dot"></span>${label}</div>
      <div style="color:var(--cream-dim);font-size:var(--fs-4);padding:12px 0 4px;">No active ${typeKey} sets in data.json.</div>
    </div>`;
  }
  const top = ranked[0];
  const runnersUp = ranked.slice(1,4);
  return `<div class="predict-card slot-${typeKey}">
    <div class="slot-label"><span class="dot"></span>${label}</div>
    <div class="predict-name">${escapeHtml(top.s.name)}</div>

    <div class="pct-bar-track" style="margin:8px 0 2px;"><div class="pct-bar-fill type-${typeKey}" style="width:${clamp(top.barPct,2,100)}%"></div></div>
    <div class="predict-meta">
      ${top.p.count} appearance${top.p.count!==1?'s':''} so far<br>
      Last seen: <b>${top.p.lastDate?fmtDisplay(top.p.lastDate):'—'}</b><br>
      Estimated next: <b>${fmtDisplay(top.p.predicted)}</b> (${overdueText(top.p.daysDiff)})<br>
      Set price: ${priceCellHtml(top.s.name)}
    </div>
    ${runnersUp.length ? `<div class="slot-queue">
      <div class="slot-queue-title">Next in line for this slot</div>
      ${runnersUp.map((x,i)=>`<div class="slot-queue-item">
        <div class="slot-queue-row"><b>${i+2}. ${escapeHtml(x.s.name)}</b><span class="q-pct">${x.pct.toFixed(1)}%</span></div>
        <div class="pct-bar-track slot-queue-bar"><div class="pct-bar-fill type-${typeKey}" style="width:${clamp(x.barPct,2,100)}%"></div></div>
      </div>`).join('')}
    </div>` : ''}
  </div>`;
}
function vintageTag(vintageStr){
  if(!vintageStr) return '<span class="vintage-dash">—</span>';
  return `<span class="vintage-tag" title="Went vintage on ${fmtDisplay(toUTC(vintageStr))}">Vintage ${fmtDisplay(toUTC(vintageStr))}</span>`;
}
function overdueText(daysDiff){
  if(daysDiff>0) return `<b>${daysDiff}d</b> overdue`;
  return `due in <b>${Math.abs(daysDiff)}d</b>`;
}
function releaseDate(s){ return s.added ? toUTC(s.added) : new Date(0); }

function computeFullExtent(stats, refDate){
  let minD = refDate, maxD = refDate;
  sets.forEach(s=>{
    const app=(s.appearances||[]).map(toUTC);
    app.forEach(d=>{ if(d<minD) minD=d; if(d>maxD) maxD=d; });
    if(!s.retired){
      const p = predictSet(s, stats, refDate);
      if(p.predicted<minD) minD=p.predicted;
      if(p.predicted>maxD) maxD=p.predicted;
    }
    if(s.vintage){
      const vd = toUTC(s.vintage);
      if(vd<minD) minD=vd;
      if(vd>maxD) maxD=vd;
    }
  });
  minD = new Date(minD.getTime()-20*DAY);
  maxD = new Date(maxD.getTime()+20*DAY);
  return {min:minD, max:maxD};
}

function computeVisibleExtent(stats, refDate){
  const relevant = foldRetired ? sets.filter(s=>!s.retired) : sets;
  if(relevant.length===0) return computeFullExtent(stats, refDate);
  let minD = refDate, maxD = refDate;
  relevant.forEach(s=>{
    const app=(s.appearances||[]).map(toUTC);
    app.forEach(d=>{ if(d<minD) minD=d; if(d>maxD) maxD=d; });
    if(!s.retired){
      const p = predictSet(s, stats, refDate);
      if(p.predicted<minD) minD=p.predicted;
      if(p.predicted>maxD) maxD=p.predicted;
    }
  });
  minD = new Date(minD.getTime()-20*DAY);
  maxD = new Date(maxD.getTime()+20*DAY);
  return {min:minD, max:maxD};
}

function renderFullTimeline(stats, refDate, ext, dispMin, dispMax){
  const active = sets.filter(s=>!s.retired).slice().sort((a,b)=>releaseDate(b)-releaseDate(a));
  const retired = sets.filter(s=>s.retired).slice().sort((a,b)=>releaseDate(b)-releaseDate(a));
  const all = active.concat(retired);
  if(all.length===0) return '<div style="color:var(--cream-dim);font-size:var(--fs-4);padding:16px 0;">No sets yet.</div>';

  const scored = all.map(s=>({s, p:predictSet(s, stats, refDate), retired: !!s.retired}));
  const manualRange = !!(rangeStart || rangeEnd);
  const span = dispMax-dispMin;
  const pct = d => ((d-dispMin)/span*100);

  function rowVisible(x){
    if(!manualRange) return true;
    const app=(x.s.appearances||[]).map(toUTC);
    if(app.some(d=>d>=dispMin && d<=dispMax)) return true;
    if(!x.retired && x.p.predicted>=dispMin && x.p.predicted<=dispMax) return true;
    if(x.s.vintage){ const vd=toUTC(x.s.vintage); if(vd>=dispMin && vd<=dispMax) return true; }
    return false;
  }

  const yearStarts = [];
  for(let y=dispMin.getUTCFullYear(); y<=dispMax.getUTCFullYear(); y++){
    const yd = new Date(Date.UTC(y,0,1));
    if(yd>=dispMin && yd<=dispMax) yearStarts.push(yd);
  }
  const yearLines = yearStarts.map(yd=>`<div class="timeline-yearline" style="left:${pct(yd)}%"></div>`).join('');

  let html = `<div class="timeline-year-header">
    <div></div>
    <div class="timeline-year-track">${yearStarts.map(yd=>`<div class="timeline-year-label" style="left:${clamp(pct(yd),0,100)}%">${yd.getUTCFullYear()}</div>`).join('')}</div>
  </div>`;
  html += `<div class="timeline-header">
    <div></div>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--long)"></span>Uncommon</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--short)"></span>Rare</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--unknown)"></span>unknown</span>
      <span class="legend-item"><span style="width:8px;height:8px;border-radius:50%;border:1.5px dashed var(--gold);display:inline-block;"></span>predicted next</span>
      <span class="legend-item"><span style="width:8px;height:8px;background:var(--vintage);display:inline-block;transform:rotate(45deg);"></span>went vintage</span>
      <span class="legend-item"><span style="width:14px;height:2px;background:var(--long);display:inline-block;"></span>history</span>
      <span class="legend-item"><span style="width:14px;height:0;border-top:2px dashed var(--long);display:inline-block;"></span>to predicted</span>
      <span class="legend-item"><span style="width:1px;height:10px;background:var(--gold);display:inline-block;"></span>reference date</span>
    </div>
  </div>`;

  function row(x){
    const s=x.s, p=x.p;
    const app=(s.appearances||[]).map(toUTC).sort((a,b)=>a-b);
    let dots = `<div class="axis-line"></div>${yearLines}`;
    dots += `<div class="timeline-refline next-update" style="left:${clamp(pct(refDate),0,100)}%"></div>`;
    if(app.length>1){
      const l1=clamp(pct(app[0]),0,100), l2=clamp(pct(app[app.length-1]),0,100);
      dots += `<div class="timeline-connector ${p.type}" style="left:${l1}%;width:${l2-l1}%"></div>`;
    }
    if(!x.retired && app.length){
      const lastPct=clamp(pct(app[app.length-1]),0,100), predPct=clamp(pct(p.predicted),0,100);
      if(predPct>lastPct){
        dots += `<div class="timeline-connector to-predicted ${p.type}" style="left:${lastPct}%;width:${predPct-lastPct}%"></div>`;
      }
    }
    app.forEach(d=>{
      const dp = pct(d);
      if(dp<0 || dp>100) return;
      dots += `<div class="timeline-dot ${p.type}" style="left:${dp}%" title="${fmtDisplay(d)}"></div>`;
    });
    if(!x.retired){
      dots += `<div class="timeline-dot predicted ${p.type}" style="left:${clamp(pct(p.predicted),0,100)}%" title="predicted: ${fmtDisplay(p.predicted)}"></div>`;
    }
    if(s.vintage){
      const vp = pct(toUTC(s.vintage));
      if(vp>=0 && vp<=100){
        dots += `<div class="timeline-dot vintage" style="left:${vp}%" title="went vintage: ${fmtDisplay(toUTC(s.vintage))}"></div>`;
      }
    }
    return `<div class="timeline-row ${x.retired?'is-retired':''}" onclick="toggleExpand('${escapeAttr(s.name)}')">
      <div class="timeline-label" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
      <div class="timeline-track">${dots}</div>
    </div>
    ${expandedName===s.name ? `<div style="grid-column:1/-1;">${renderDetailPanel(s, p)}</div>` : ''}`;
  }

  const visibleActive = scored.filter(x=>!x.retired).filter(rowVisible);
  visibleActive.forEach(x=>{ html += row(x); });

  if(retired.length){
    if(foldRetired){
      html += `<div class="timeline-divider retired-toggle" onclick="toggleFoldRetired()" role="button" tabindex="0">
        <div class="divider-label"><span class="divider-arrow">&#9656;</span>Retired sets hidden — click to show</div>
        <div class="divider-line"></div>
      </div>`;
    } else {
      const visibleRetired = scored.filter(x=>x.retired).filter(rowVisible);
      html += `<div class="timeline-divider retired-toggle" onclick="toggleFoldRetired()" role="button" tabindex="0">
        <div class="divider-label"><span class="divider-arrow">&#9662;</span>Retired sets${manualRange && visibleRetired.length!==retired.length ? ` (${visibleRetired.length} of ${retired.length} in range)` : ''}</div>
        <div class="divider-line"></div>
      </div>`;
      visibleRetired.forEach(x=>{ html += row(x); });
    }
  }

  if(manualRange && visibleActive.length===0 && (foldRetired || scored.filter(x=>x.retired).filter(rowVisible).length===0)){
    html += `<div style="color:var(--cream-dim);font-size:var(--fs-4);padding:10px 0;">No sets fall in this date range.</div>`;
  }
  return html;
}

function renderDetailPanel(s, p){
  const app=(s.appearances||[]).slice().sort();
  const chips = app.map(d=>`<span class="chip">${d}</span>`).join('') || '<span style="color:var(--cream-dim);">none yet</span>';
  return `<div class="detail-panel">
    <div class="detail-row">
      <span>Release date: <b>${s.added?fmtDisplay(toUTC(s.added)):'—'}</b></span>
      <span>Status: <b>${s.retired?'Retired':'Active'}</b></span>
      <span>Type: <b>${(()=>{const t=p?p.type:(s.type||'unknown'); return t==='long'?'Uncommon':t==='short'?'Rare':'unknown';})()}</b></span>
      <span>Vintage: <b>${s.vintage?fmtDisplay(toUTC(s.vintage)):'Not vintage'}</b></span>
    </div>
    <div class="chip-list">${chips}</div>
  </div>`;
}

  const longRanked = scored.filter(x=>x.p.type==='long').sort((a,b)=>b.pct-a.pct);
  const chronological = scored.slice().sort((a,b)=>toUTC(a.s.added)-toUTC(b.s.added));
  const retiredCount = sets.filter(s=>s.retired).length;
  let tlExt = null;

  if(pricesStatus==='error'){
    html += `<div class="status-msg show status-err" style="position:static;margin-bottom:14px;">Could not load prices from the GW2 API (${escapeHtml(pricesErrorMsg)}). The API is usually reachable directly from a browser — try again, or check your connection.</div>`;

  let mainHtml = `<div class="tabs">
    <button class="tab-btn ${activeTab==='list'?'active':''}" onclick="switchTab('list')">List</button>
    <button class="tab-btn ${activeTab==='timeline'?'active':''}" onclick="switchTab('timeline')">Timeline</button>
  </div>`;

  if(activeTab==='timeline'){
    tlExt = computeFullExtent(stats, refDate);
    const totalDays = Math.max(1, daysBetween(tlExt.min, tlExt.max));
    const defaultExt = foldRetired ? computeVisibleExtent(stats, refDate) : tlExt;
    const dispMin = rangeStart ? toUTC(rangeStart) : defaultExt.min;
    const dispMax = rangeEnd ? toUTC(rangeEnd) : defaultExt.max;
    const startOffset = clamp(daysBetween(tlExt.min, dispMin), 0, totalDays);
    const endOffset = clamp(daysBetween(tlExt.min, dispMax), 0, totalDays);
    const startPct = startOffset/totalDays*100, endPct = endOffset/totalDays*100;

    mainHtml += `<h2>Rotation timeline</h2>
    <div class="hint" style="margin:-6px 0 14px;">Active sets first, newest release date on top; retired sets follow the divider, also newest release date first. Click a name for details.</div>`;

    mainHtml += `<div class="timeline-controls">
      <div class="control-row">
        <button class="small" onclick="fitRangeToVisible()">Fit range to ${foldRetired && retiredCount ? 'active sets' : 'visible'}</button>
        ${(rangeStart||rangeEnd) ? '<button class="small" onclick="resetRange()">Reset date range</button>' : ''}
        <span class="hint">Drag the handles below to zoom the timeline to a date range.</span>
      </div>
      <div class="range-slider-wrap">
        <div class="range-slider-base-track"></div>
        <div class="range-slider-fill" id="range-fill" style="left:${startPct}%;width:${endPct-startPct}%"></div>
        <input type="range" id="range-start-input" min="0" max="${totalDays}" step="1" value="${startOffset}" aria-label="Range start">
        <input type="range" id="range-end-input" min="0" max="${totalDays}" step="1" value="${endOffset}" aria-label="Range end">
      </div>
      <div class="range-slider-labels">
        <span id="range-start-label">${fmtDisplay(dispMin)}</span>
        <span id="range-end-label">${fmtDisplay(dispMax)}</span>
      </div>
    </div>`;

    mainHtml += `<div class="timeline-block">${renderFullTimeline(stats, refDate, tlExt, dispMin, dispMax)}</div>`;
  } else {
    if(pricesStatus==='loaded'){
      let activeBuy=0, activeSell=0;
      chronological.forEach(x=>{
        if(collectedSets.has(x.s.name)) return;
        const p=prices[x.s.name]; if(p){ activeBuy+=p.buy; activeSell+=p.sell; }
      });
      let allBuy=0, allSell=0;
      let cheapestBuy=null, cheapestSell=null;
      sets.forEach(s=>{
        if(collectedSets.has(s.name)) return;
        const p=prices[s.name]; if(!p) return;
        allBuy+=p.buy; allSell+=p.sell;
        if(p.buy>0 && (!cheapestBuy || p.buy<cheapestBuy.val)) cheapestBuy={name:s.name, val:p.buy};
        if(p.sell>0 && (!cheapestSell || p.sell<cheapestSell.val)) cheapestSell={name:s.name, val:p.sell};
      });
      const collectedNote = collectedSets.size ? ` — ${collectedSets.size} collected set${collectedSets.size!==1?'s':''} excluded` : '';
      mainHtml += `<div class="price-summary">
        <div class="price-summary-grid">
          <div class="ps-col">
            <div class="ps-title">Active Roster</div>
            <div class="ps-line"><span class="ps-lbl">Buy</span>${coinHtml(activeBuy)}</div>
            <div class="ps-line"><span class="ps-lbl">Sell</span>${coinHtml(activeSell)}</div>
          </div>
          <div class="ps-col">
            <div class="ps-title">All Sets</div>
            <div class="ps-line"><span class="ps-lbl">Buy</span>${coinHtml(allBuy)}</div>
            <div class="ps-line"><span class="ps-lbl">Sell</span>${coinHtml(allSell)}</div>
          </div>
          <div class="ps-col ps-col-cheapest">
            <div class="ps-line"><span class="ps-lbl">Cheapest buy</span>${cheapestBuy?`<b>${escapeHtml(cheapestBuy.name)}</b> ${coinHtml(cheapestBuy.val)}`:'—'}</div>
            <div class="ps-line"><span class="ps-lbl">Cheapest sell</span>${cheapestSell?`<b>${escapeHtml(cheapestSell.name)}</b> ${coinHtml(cheapestSell.val)}`:'—'}</div>
          </div>
        </div>
        <span class="note">live from the GW2 API${pricesUpdatedAt?', updated '+pricesUpdatedAt.toLocaleTimeString():''} — sums are buy-order and sell-listing totals across all skins in each set${collectedNote}; cheapest buy/sell are the single lowest-priced uncollected sets. Check off sets below as you collect them to update these.</span>
      </div>`;
    }

    mainHtml += `<div class="section-head"><h2>Full active roster</h2><span class="hint">oldest release date first — click a name for details</span></div>`;
    mainHtml += `<table class="roster"><thead><tr>
      <th class="check-col"></th><th>Set</th><th>Type</th><th class="num">Appearances</th><th class="num">Last seen</th><th class="num">Est. next</th><th>Likelihood</th><th>Price (buy / sell)</th>
    </tr></thead><tbody>`;
    chronological.forEach(x=>{
      const p=x.p, s=x.s;
      const isCollected = collectedSets.has(s.name);
      mainHtml += `<tr class="${isCollected?'is-collected':''}">
        <td class="check-col" onclick="toggleCollected('${escapeAttr(s.name)}', event)"><input type="checkbox" class="collected-check" ${isCollected?'checked':''} onclick="toggleCollected('${escapeAttr(s.name)}', event)" title="Mark as collected"></td>
        <td class="name" onclick="toggleExpand('${escapeAttr(s.name)}')">${escapeHtml(s.name)}</td>
        <td>${typeTag(p.type)}</td>
        <td class="num">${p.count}</td>
        <td class="num">${p.lastDate?fmtDisplay(p.lastDate):'—'}</td>
        <td class="num">${fmtDisplay(p.predicted)}</td>
        <td><div class="pct-bar-wrap"><div class="pct-bar-track"><div class="pct-bar-fill type-${p.type}" style="width:${clamp(x.barPct,2,100)}%"></div></div><span class="pct-num type-${p.type}">${x.pct.toFixed(1)}%</span></div></td>
        <td class="price">${priceCellHtml(s.name)}</td>
      </tr>
      ${expandedName===s.name ? `<tr><td colspan="8">${renderDetailPanel(s,p)}</td></tr>` : ''}
      `;
    });
    mainHtml += `</tbody></table>`;

    if(retiredCount){
      const vintageCount = sets.filter(s=>s.vintage).length;
      mainHtml += `<div class="section-head retired-toggle-row" style="margin-top:32px;" onclick="toggleListRetired()" role="button" tabindex="0">
        <h2><span class="divider-arrow">${listShowRetired ? '&#9662;' : '&#9656;'}</span>Retired sets</h2>
        <span class="hint">${listShowRetired?`newest release date first — click a name for details${vintageCount?` · ${vintageCount} have gone vintage`:''}`:'click to show'}</span>
      </div>`;
      if(listShowRetired){
        const retiredRows = sets.filter(s=>s.retired)
          .map(s=>({s, p:predictSet(s, stats, refDate)}))
          .sort((a,b)=>toUTC(b.s.added)-toUTC(a.s.added));
        mainHtml += `<table class="roster"><thead><tr>
          <th class="check-col"></th><th>Set</th><th>Type</th><th class="num">Appearances</th><th class="num">Last seen</th><th>Price (buy / sell)</th><th>Vintage</th>
        </tr></thead><tbody>`;
        retiredRows.forEach(x=>{
          const p=x.p, s=x.s;
          const isCollected = collectedSets.has(s.name);
          mainHtml += `<tr class="${isCollected?'is-collected':''}">
            <td class="check-col" onclick="toggleCollected('${escapeAttr(s.name)}', event)"><input type="checkbox" class="collected-check" ${isCollected?'checked':''} onclick="toggleCollected('${escapeAttr(s.name)}', event)" title="Mark as collected"></td>
            <td class="name" onclick="toggleExpand('${escapeAttr(s.name)}')">${escapeHtml(s.name)}</td>
            <td>${typeTag(p.type)}</td>
            <td class="num">${p.count}</td>
            <td class="num">${p.lastDate?fmtDisplay(p.lastDate):'—'}</td>
            <td class="price">${priceCellHtml(s.name)}</td>
            <td>${vintageTag(s.vintage)}</td>
          </tr>
          ${expandedName===s.name ? `<tr><td colspan="7">${renderDetailPanel(s,p)}</td></tr>` : ''}
          `;
        });
        mainHtml += `</tbody></table>`;
      }
    }
  }

  html += `<div class="layout-grid" data-tab="${activeTab}">
    <div class="sidebar">${sidebarHtml}</div>
    <div class="main-col">${mainHtml}</div>
  </div>`;

  html += `<div class="footnote" style="margin-top:24px;">
    Each set's rotation slot — Uncommon or Rare — comes from the <code>"type"</code> field in <code>data.json</code> (<code>"long"</code>/<code>"short"</code> internally). Uncommon sets average ~${Math.round(stats.longMean)}d between appearances and Rare sets ~${Math.round(stats.shortMean)}d, both recomputed live from typed sets' actual gaps. Sets without a <code>"type"</code> in the file are treated as unknown and predicted using a blend of both, and are excluded from the slot rankings above since they can't be assigned to either. Appearances before 9 Nov 2021 predate the current system and are excluded from the gap statistics. Likelihood reflects how close the reference date is to each set's projected next appearance relative to its slot peers — it doesn't factor in how many times a set has already appeared toward its typical retirement, so use the appearance count to judge that yourself.
    <br><br>
    <code>data.json</code> is the only source of truth — this page is read-only and reloads it fresh (no caching) every time it loads or you hit "Refresh data.json". The only thing saved in your browser is the reference date above.
  </div>`;

  document.getElementById('app').innerHTML = html;
  if(activeTab==='timeline' && tlExt){ attachRangeSliderHandlers(tlExt.min, tlExt.max); }
}

function attachRangeSliderHandlers(fullMin, fullMax){
  const totalDays = Math.max(1, daysBetween(fullMin, fullMax));
  const startInput = document.getElementById('range-start-input');
  const endInput = document.getElementById('range-end-input');
  const fill = document.getElementById('range-fill');
  const startLabel = document.getElementById('range-start-label');
  const endLabel = document.getElementById('range-end-label');
  if(!startInput || !endInput) return;

  function offsetToDate(off){ return new Date(fullMin.getTime()+off*DAY); }

  function liveUpdate(movedStart){
    let s = parseInt(startInput.value,10), e = parseInt(endInput.value,10);
    if(s>e){
      if(movedStart){ e=s; endInput.value=e; } else { s=e; startInput.value=s; }
    }
    const sPct = s/totalDays*100, ePct = e/totalDays*100;
    fill.style.left = sPct+'%';
    fill.style.width = (ePct-sPct)+'%';
    startLabel.textContent = fmtDisplay(offsetToDate(s));
    endLabel.textContent = fmtDisplay(offsetToDate(e));
  }
  function commit(){
    let s = parseInt(startInput.value,10), e = parseInt(endInput.value,10);
    if(s>e){ const t=s; s=e; e=t; }
    rangeStart = fmtISO(offsetToDate(s));
    rangeEnd = fmtISO(offsetToDate(e));
    render();
  }
  startInput.addEventListener('input', ()=>liveUpdate(true));
  endInput.addEventListener('input', ()=>liveUpdate(false));
  startInput.addEventListener('change', commit);
  endInput.addEventListener('change', commit);
}

function resetRange(){ rangeStart=null; rangeEnd=null; render(); }
function toggleFoldRetired(){ foldRetired=!foldRetired; render(); }
function fitRangeToVisible(){
  const refDate = getRefDate();
  const stats = computeGlobalStats();
  const ext = computeVisibleExtent(stats, refDate);
  rangeStart = fmtISO(ext.min);
  rangeEnd = fmtISO(ext.max);
  render();
}

function priceCellHtml(name){
  if(pricesStatus==='loading') return `<span class="coin dim">loading…</span>`;
  const p = prices[name];
  if(!p) return `<span class="coin dim">—</span>`;
  const warn = p.missing ? `<span class="price-incomplete" title="${p.missing} of ${p.count*2} listings missing for this set">partial</span>` : '';
  return `<span class="lbl">Buy</span>${coinHtml(p.buy)}${warn}<br><span class="lbl">Sell</span>${coinHtml(p.sell)}`;
}

function toggleExpand(name){ expandedName = (expandedName===name) ? null : name; render(); }
function toggleListRetired(){ listShowRetired = !listShowRetired; render(); }

async function fetchNextUpdateFromShaman(){
  shamanStatus = 'loading';
  render();
  try{
    const res = await fetch('https://thatshaman.com/tools/countdown/?format=json');
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    if(!data.when) throw new Error('no date in response');
    const iso = String(data.when).slice(0,10);
    nextUpdateDate = iso;
    saveRefDate();
    shamanStatus = 'loaded';
    showStatus(`Reference date set to ${iso} from thatshaman.com${data.confirmed===false?' (unconfirmed)':''}.`, false);
  }catch(e){
    shamanStatus = 'error';
    showStatus('Could not reach thatshaman.com automatically — your browser may be blocking the cross-site request. Falling back to today\'s date; try the refresh button again in a moment.', true);
  }
  render();
}

async function refreshData(){
  await loadSets();
  showStatus(dataLoadError ? 'Could not refresh data.json.' : 'Reloaded data.json.', !!dataLoadError);
  render();
}

(async function init(){
  loadRefDate(); // cached fallback in case the live fetch below fails
  loadCollected();
  await loadSets();
  await loadSkinIds();
  render();
  loadPrices();
  fetchNextUpdateFromShaman(); // always try to get the live date on load
})();
</script>
</body>
