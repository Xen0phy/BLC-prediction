<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Black Lion Chest — Rotation Predictor</title>
<style>
  :root{
    --bg:#14110d; --panel:#1c1812; --panel2:#231d15;
    --line:#3a3122; --line-soft:#2a2419;
    --gold:#c9973f; --gold-bright:#e3b45f;
    --cream:#e9e1cf; --cream-dim:#a89e88; --cream-faint:#756c5a;
    --long:#c9793f; --long-bg:#2c1c12; --long-text:#e39a76;
    --short:#4fae94; --short-bg:#132621; --short-text:#8fd6c1;
    --unknown:#8b7d55; --unknown-bg:#2a2618;
    --danger:#a5402f;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-num: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--font-body);}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px;}

  .masthead{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px;}
  .masthead h1{font-family:var(--font-display);font-size:24px;font-weight:400;margin:0;color:var(--gold-bright);}
  .masthead p{margin:4px 0 0;font-size:13px;color:var(--cream-dim);}

  .ref-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:28px;font-size:12.5px;}
  .ref-bar .field{display:flex;align-items:center;gap:6px;}
  .ref-bar label{color:var(--cream-dim);}
  .ref-bar input{background:var(--panel2);border:1px solid var(--line);color:var(--cream);border-radius:4px;padding:5px 8px;font-size:12.5px;}
  .ref-bar .note{color:var(--cream-faint);font-family:var(--font-num);}

  h2{font-family:var(--font-display);font-weight:400;font-size:18px;color:var(--gold);margin:0 0 12px;}
  h3{font-family:var(--font-display);font-weight:400;font-size:15px;color:var(--gold);margin:0 0 10px;}

  .tabs{display:flex;gap:22px;margin-bottom:24px;border-bottom:1px solid var(--line);}
  .tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--cream-dim);padding:8px 2px 10px;font-size:14px;font-family:var(--font-display);cursor:pointer;border-radius:0;}
  .tab-btn:hover{color:var(--cream);}
  .tab-btn.active{color:var(--gold-bright);border-bottom-color:var(--gold);}

  .timeline-divider{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;margin:14px 0 8px;}
  .timeline-divider .divider-label{font-size:10.5px;color:var(--cream-faint);text-transform:uppercase;letter-spacing:0.8px;white-space:nowrap;}
  .timeline-divider .divider-line{height:1px;background:var(--line);}
  .timeline-row.is-retired .timeline-label{color:var(--cream-faint);}

  .predict-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:36px;}
  @media (max-width:640px){.predict-grid{grid-template-columns:1fr;}}
  .predict-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 20px;position:relative;}
  .predict-card::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--gold);}
  .predict-rank{font-family:var(--font-num);font-size:11px;color:var(--cream-faint);text-transform:uppercase;letter-spacing:1.5px;}
  .predict-name{font-family:var(--font-display);font-size:21px;color:var(--cream);margin:4px 0 8px;}
  .predict-pct{font-family:var(--font-num);font-size:30px;color:var(--gold-bright);line-height:1;}
  .predict-pct span{font-size:14px;color:var(--cream-faint);}
  .predict-meta{margin-top:10px;font-size:12px;color:var(--cream-dim);line-height:1.6;}
  .predict-meta b{color:var(--cream);font-weight:600;}

  .type-tag{display:inline-block;font-size:10px;letter-spacing:0.5px;text-transform:uppercase;padding:2px 7px;border-radius:3px;font-family:var(--font-num);}
  .type-long{background:var(--long-bg);color:var(--long-text);}
  .type-short{background:var(--short-bg);color:var(--short-text);}
  .type-unknown{background:var(--unknown-bg);color:var(--unknown);}

  .timeline-block{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px 20px;margin-bottom:32px;overflow-x:auto;}
  .timeline-row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line-soft);}
  .timeline-row:last-child{border-bottom:none;}
  .timeline-label{font-size:12px;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .timeline-track{position:relative;height:20px;min-width:420px;}
  .timeline-track .axis-line{position:absolute;top:50%;left:0;right:0;height:1px;background:var(--line-soft);}
  .timeline-dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);border:1.5px solid var(--bg);}
  .timeline-dot.long{background:var(--long);}
  .timeline-dot.short{background:var(--short);}
  .timeline-dot.unknown{background:var(--unknown);}
  .timeline-dot.predicted{background:transparent;border:1.5px dashed var(--gold-bright);width:11px;height:11px;}
  .timeline-refline{position:absolute;top:-2px;bottom:-2px;width:1px;z-index:1;}
  .timeline-refline.today{background:var(--cream-faint);}
  .timeline-refline.next-update{background:var(--gold-bright);}
  .timeline-yearline{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line-soft);z-index:0;}
  .timeline-year-header{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-bottom:2px;}
  .timeline-year-track{position:relative;height:14px;}
  .timeline-year-label{position:absolute;top:0;font-size:9.5px;color:var(--cream-faint);font-family:var(--font-num);transform:translateX(-50%);white-space:nowrap;}
  .timeline-header{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-bottom:6px;}
  .timeline-header .legend{display:flex;gap:16px;font-size:11px;color:var(--cream-faint);align-items:center;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:5px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;}
  .hint{font-size:12px;color:var(--cream-faint);}

  table.roster{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px;}
  table.roster th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--cream-faint);font-weight:400;padding:6px 10px;border-bottom:1px solid var(--line);}
  table.roster td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  table.roster tr:hover td{background:rgba(201,151,63,0.04);}
  td.num{font-family:var(--font-num);color:var(--cream-dim);}
  td.name{color:var(--cream);font-weight:500;cursor:pointer;}
  td.name:hover{color:var(--gold-bright);text-decoration:underline;}
  .pct-bar-wrap{display:flex;align-items:center;gap:8px;}
  .pct-bar-track{flex:1;height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;min-width:50px;}
  .pct-bar-fill{height:100%;background:var(--gold);}
  .pct-num{font-family:var(--font-num);font-size:12px;color:var(--gold-bright);min-width:34px;text-align:right;}

  select.type-select{background:var(--panel2);border:1px solid var(--line);color:var(--cream);border-radius:4px;padding:4px 6px;font-size:11px;font-family:var(--font-num);}

  .roster-actions{display:flex;gap:6px;flex-wrap:wrap;}
  button{font-family:var(--font-body);font-size:12px;cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--cream-dim);padding:5px 10px;}
  button:hover{border-color:var(--gold);color:var(--cream);}
  button.primary{background:var(--gold);border-color:var(--gold);color:#231a0c;font-weight:600;}
  button.primary:hover{background:var(--gold-bright);}
  button.danger:hover{border-color:var(--danger);color:#f0a08f;}
  button.link{background:none;border:none;color:var(--gold);padding:0;font-size:12px;text-decoration:underline;}
  button.small{padding:2px 7px;font-size:11px;}

  .edit-panel{background:var(--panel2);border:1px solid var(--line);border-radius:6px;margin:6px 0 16px;padding:14px 16px;}
  .edit-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--cream-faint);}
  .field input,.field select{background:var(--panel);border:1px solid var(--line);color:var(--cream);border-radius:4px;padding:7px 9px;font-size:13px;font-family:var(--font-body);min-width:150px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--gold);}
  .chip-list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
  .chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 6px 4px 10px;font-size:12px;font-family:var(--font-num);}
  .chip button{padding:0 5px;font-size:12px;border:none;background:none;color:var(--cream-faint);}
  .chip button:hover{color:var(--danger);}
  .add-appearance{display:flex;gap:6px;align-items:center;}


  .panel-box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:20px;}
  .footnote{font-size:11.5px;color:var(--cream-faint);line-height:1.6;margin-top:6px;}
  .status-msg{font-size:12px;padding:8px 10px;border-radius:4px;margin-bottom:14px;display:none;}
  .status-msg.show{display:block;}
  .status-ok{background:var(--short-bg);color:#9fdcc9;}
  .status-err{background:var(--long-bg);color:#e8ab8d;}
  .loading{padding:60px 0;text-align:center;color:var(--cream-faint);font-size:13px;}
</style>
</head>

","appearances":[],"retired":false},{"name":"Synergetics","added":"2026-05-12","appearances":[],"retired":false},{"name":"Primeval","added":"2026-08-11","appearances":[],"retired":false}];
const STORAGE_KEY = 'blc-dataset-v2';
const CUTOFF = new Date('2021-11-09T00:00:00Z');
const DAY = 86400000;
let state = null;
let expandedId = null;
let activeTab = 'list';
function switchTab(tab){ activeTab = tab; render(); }

function toUTC(iso){ return new Date(iso + 'T00:00:00Z'); }
function daysBetween(a,b){ return Math.round((b-a)/DAY); }
function fmtDate(d){ return d.toISOString().slice(0,10); }
function fmtDisplay(d){ return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}); }
function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function stdev(arr){ if(arr.length<2) return 0; const m=mean(arr); return Math.sqrt(mean(arr.map(x=>(x-m)**2))); }
function sigmoid(z){ return 1/(1+Math.exp(-z)); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function todayUTC(){ const n=new Date(); return new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let idCounter = 1;
function nextId(){ return 'set_'+(idCounter++)+'_'+Date.now().toString(36); }

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Array.isArray(parsed) ? {sets:parsed, nextUpdateDate:null} : parsed;
      state.sets.forEach(s=>{ if(!s.id) s.id = nextId(); if(s.typeOverride===undefined) s.typeOverride=null; });
      return;
    }
  }catch(e){}
  state = { sets: JSON.parse(JSON.stringify(SEED)).map(s=>({...s, id: nextId(), typeOverride:null})), nextUpdateDate: null };
  await saveState();
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ showStatus('Could not save — your changes may not persist. (Is your browser blocking local storage, e.g. private/incognito mode?)', true); }
}
function showStatus(msg, isErr){
  const el = document.getElementById('status-msg');
  if(!el) return;
  el.textContent = msg;
  el.className = 'status-msg show ' + (isErr?'status-err':'status-ok');
  setTimeout(()=>el.classList.remove('show'), 3500);
}

function computeGlobalStats(){
  const longGaps=[], shortGaps=[];
  let longCount=0, shortCount=0;
  const debutDays=[];
  for(const s of state.sets){
    const app=(s.appearances||[]).map(toUTC).sort((a,b)=>a-b);
    if(app.length && s.added){
      const added=toUTC(s.added);
      const d=daysBetween(added, app[0]);
      if(d>0 && app[0]>=CUTOFF) debutDays.push(d);
    }
    if(app.length<2) continue;
    if(app[0]<CUTOFF) continue;
    const gaps=[]; for(let i=1;i<app.length;i++) gaps.push(daysBetween(app[i-1],app[i]));
    let t = s.typeOverride;
    if(!t){ t = mean(gaps)>250 ? 'long' : 'short'; }
    if(t==='long'){ longGaps.push(...gaps); longCount++; } else { shortGaps.push(...gaps); shortCount++; }
  }
  const longMean = longGaps.length? mean(longGaps):353;
  const longStd = Math.max(20, longGaps.length>3? stdev(longGaps):28);
  const shortMean = shortGaps.length? mean(shortGaps):179;
  const shortStd = Math.max(20, shortGaps.length>3? stdev(shortGaps):39);
  const totalTyped = longCount+shortCount;
  const priorLong = totalTyped? longCount/totalTyped : 0.6;
  const priorShort = 1-priorLong;
  const debutMean = debutDays.length? mean(debutDays):380;
  const debutStd = Math.max(40, debutDays.length>3? stdev(debutDays):150);
  return {longMean,longStd,shortMean,shortStd,priorLong,priorShort,debutMean,debutStd};
}

function predictSet(s, stats, refDate){
  const app=(s.appearances||[]).map(toUTC).sort((a,b)=>a-b);
  if(app.length===0){
    const added=toUTC(s.added);
    const predicted=new Date(added.getTime()+stats.debutMean*DAY);
    const z=daysBetween(predicted, refDate)/stats.debutStd;
    return {score:sigmoid(z), type:'unknown', count:0, lastDate:null, predicted, daysDiff:daysBetween(predicted,refDate)};
  }
  const last=app[app.length-1];
  if(app.length===1){
    let type = s.typeOverride;
    let predicted, std;
    if(type==='long'){ predicted=new Date(last.getTime()+stats.longMean*DAY); std=stats.longStd; }
    else if(type==='short'){ predicted=new Date(last.getTime()+stats.shortMean*DAY); std=stats.shortStd; }
    else{
      type='unknown';
      const blendGap = stats.priorLong*stats.longMean+stats.priorShort*stats.shortMean;
      std = Math.sqrt(stats.priorLong*stats.longStd**2+stats.priorShort*stats.shortStd**2);
      predicted = new Date(last.getTime()+blendGap*DAY);
    }
    const z=daysBetween(predicted, refDate)/Math.max(20,std);
    return {score:sigmoid(z), type, count:1, lastDate:last, predicted, daysDiff:daysBetween(predicted,refDate)};
  }
  const gaps=[]; for(let i=1;i<app.length;i++) gaps.push(daysBetween(app[i-1],app[i]));
  const ownAvg=mean(gaps);
  let type = s.typeOverride || (ownAvg>250?'long':'short');
  const typeMean = type==='long'?stats.longMean:stats.shortMean;
  const typeStd = type==='long'?stats.longStd:stats.shortStd;
  const ownWeight = clamp(gaps.length/3,0,1);
  const expectedGap = ownWeight*ownAvg+(1-ownWeight)*typeMean;
  const predicted=new Date(last.getTime()+expectedGap*DAY);
  const z=daysBetween(predicted, refDate)/typeStd;
  return {score:sigmoid(z), type, count:app.length, lastDate:last, predicted, daysDiff:daysBetween(predicted,refDate)};
}

function getRefDate(){ return state.nextUpdateDate ? toUTC(state.nextUpdateDate) : todayUTC(); }

function buildPredictions(){
  const stats = computeGlobalStats();
  const refDate = getRefDate();
  const active = state.sets.filter(s=>!s.retired);
  const scored = active.map(s=>({s, p:predictSet(s, stats, refDate)}));
  const totalScore = scored.reduce((a,b)=>a+b.p.score,0)||1;
  scored.forEach(x=>x.pct = x.p.score/totalScore*100);
  return {scored, stats, refDate};
}

function typeTag(type){
  if(type==='long') return '<span class="type-tag type-long">long</span>';
  if(type==='short') return '<span class="type-tag type-short">short</span>';
  return '<span class="type-tag type-unknown">unknown</span>';
}
function overdueText(daysDiff){
  if(daysDiff>0) return `<b>${daysDiff}d</b> overdue`;
  return `due in <b>${Math.abs(daysDiff)}d</b>`;
}

function releaseDate(s){
  return s.added ? toUTC(s.added) : new Date(0);
}

function renderFullTimeline(stats, refDate){
  const active = state.sets.filter(s=>!s.retired).slice().sort((a,b)=>releaseDate(b)-releaseDate(a));
  const retired = state.sets.filter(s=>s.retired).slice().sort((a,b)=>releaseDate(b)-releaseDate(a));
  const all = active.concat(retired);
  if(all.length===0) return '<div style="color:var(--cream-dim);font-size:13px;padding:16px 0;">No sets yet.</div>';

  const scored = all.map(s=>({s, p:predictSet(s, stats, refDate), retired: !!s.retired}));

  let minD = refDate, maxD = refDate;
  scored.forEach(x=>{
    const app=(x.s.appearances||[]).map(toUTC);
    app.forEach(d=>{ if(d<minD) minD=d; if(d>maxD) maxD=d; });
    if(!x.retired){
      if(x.p.predicted<minD) minD=x.p.predicted;
      if(x.p.predicted>maxD) maxD=x.p.predicted;
    }
  });
  minD = new Date(minD.getTime()-20*DAY);
  maxD = new Date(maxD.getTime()+20*DAY);
  const span = maxD-minD;
  const pct = d => ((d-minD)/span*100);

  const yearStarts = [];
  for(let y=minD.getUTCFullYear(); y<=maxD.getUTCFullYear(); y++){
    const yd = new Date(Date.UTC(y,0,1));
    if(yd>=minD && yd<=maxD) yearStarts.push(yd);
  }
  const yearLines = yearStarts.map(yd=>`<div class="timeline-yearline" style="left:${pct(yd)}%"></div>`).join('');

  let html = `<div class="timeline-year-header">
    <div></div>
    <div class="timeline-year-track">${yearStarts.map(yd=>`<div class="timeline-year-label" style="left:${clamp(pct(yd),0,100)}%">${yd.getUTCFullYear()}</div>`).join('')}</div>
  </div>`;
  html += `<div class="timeline-header">
    <div></div>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--long)"></span>long</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--short)"></span>short</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--unknown)"></span>unknown</span>
      <span class="legend-item"><span style="width:8px;height:8px;border-radius:50%;border:1.5px dashed var(--gold-bright);display:inline-block;"></span>predicted next</span>
      <span class="legend-item"><span style="width:1px;height:10px;background:var(--gold-bright);display:inline-block;"></span>reference date</span>
    </div>
  </div>`;

  function row(x){
    const s=x.s, p=x.p;
    const app=(s.appearances||[]).map(toUTC).sort((a,b)=>a-b);
    let dots = `<div class="axis-line"></div>${yearLines}`;
    dots += `<div class="timeline-refline next-update" style="left:${pct(refDate)}%"></div>`;
    app.forEach(d=>{
      dots += `<div class="timeline-dot ${p.type}" style="left:${pct(d)}%" title="${fmtDisplay(d)}"></div>`;
    });
    if(!x.retired){
      dots += `<div class="timeline-dot predicted" style="left:${clamp(pct(p.predicted),0,100)}%" title="predicted: ${fmtDisplay(p.predicted)}"></div>`;
    }
    return `<div class="timeline-row ${x.retired?'is-retired':''}" onclick="toggleEdit('${s.id}')">
      <div class="timeline-label" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
      <div class="timeline-track">${dots}</div>
    </div>
    ${expandedId===s.id ? `<div style="grid-column:1/-1;">${renderEditPanel(s)}</div>` : ''}`;
  }

  scored.filter(x=>!x.retired).forEach(x=>{ html += row(x); });
  if(retired.length){
    html += `<div class="timeline-divider">
      <div class="divider-label">Retired &darr;</div>
      <div class="divider-line"></div>
    </div>`;
    scored.filter(x=>x.retired).forEach(x=>{ html += row(x); });
  }
  return html;
}

function renderEditPanel(s){
  const app=(s.appearances||[]).slice().sort();
  let chips = app.map(d=>`<span class="chip">${d}<button onclick="removeAppearance('${s.id}','${d}')" aria-label="Remove date">×</button></span>`).join('');
  return `<div class="edit-panel">
    <div class="edit-row">
      <div class="field"><label>Name</label><input id="edit-name-${s.id}" value="${escapeHtml(s.name)}"></div>
      <div class="field"><label>Release date</label><input id="edit-added-${s.id}" type="date" value="${s.added||''}"></div>
      <div class="field"><label>Type override</label>
        <select id="edit-type-${s.id}">
          <option value="" ${!s.typeOverride?'selected':''}>Auto</option>
          <option value="long" ${s.typeOverride==='long'?'selected':''}>Long</option>
          <option value="short" ${s.typeOverride==='short'?'selected':''}>Short</option>
        </select>
      </div>
      <div class="field"><label>Retired</label><select id="edit-retired-${s.id}">
        <option value="false" ${!s.retired?'selected':''}>No</option>
        <option value="true" ${s.retired?'selected':''}>Yes</option>
      </select></div>
    </div>
    <label style="font-size:11px;color:var(--cream-faint);">Appearance dates</label>
    <div class="chip-list">${chips || '<span style="color:var(--cream-faint);font-size:12px;">none yet</span>'}</div>
    <div class="add-appearance">
      <input type="date" id="new-appearance-${s.id}">
      <button class="small" onclick="addAppearance('${s.id}')">Add date</button>
    </div>
    <div class="edit-row" style="margin-top:12px;">
      <button class="primary" onclick="saveEdit('${s.id}')">Save changes</button>
      <button onclick="closeEdit()">Cancel</button>
      <button class="danger" onclick="deleteSet('${s.id}')" style="margin-left:auto;">Delete set</button>
    </div>
  </div>`;
}

function render(){
  const refDate = getRefDate();
  const {scored, stats} = buildPredictions();
  const rankedTop = scored.slice().sort((a,b)=>b.pct-a.pct);
  const top2 = rankedTop.slice(0,2);
  const chronological = scored.slice().sort((a,b)=>toUTC(a.s.added)-toUTC(b.s.added));
  const retiredCount = state.sets.filter(s=>s.retired).length;

  let html = '';
  html += `<div id="status-msg" class="status-msg"></div>`;

  html += `<div class="ref-bar">
    <div class="field"><label>Reference date</label>
      <input type="date" id="next-update-input" value="${state.nextUpdateDate||''}" onchange="setNextUpdate(this.value)">
    </div>
    <span class="note">${state.nextUpdateDate? 'Predictions use the date you set — clear it to fall back to today.' : `Using today (${fmtDisplay(todayUTC())}). Set the known next update date above if you already know it.`}</span>
    ${state.nextUpdateDate? '<button class="small" onclick="setNextUpdate(\'\')">Clear</button>' : ''}
  </div>`;

  html += `<div class="tabs">
    <button class="tab-btn ${activeTab==='list'?'active':''}" onclick="switchTab('list')">List</button>
    <button class="tab-btn ${activeTab==='timeline'?'active':''}" onclick="switchTab('timeline')">Timeline${retiredCount?` (incl. ${retiredCount} retired)`:''}</button>
  </div>`;

  if(activeTab==='timeline'){
    html += `<h2>Rotation timeline</h2>
    <div class="hint" style="margin:-6px 0 14px;">Active sets first, newest release date on top; retired sets follow the divider, also newest release date first. Click a name to view or edit its history.</div>
    <div class="timeline-block">${renderFullTimeline(stats, refDate)}</div>`;
  } else {
    html += `<h2>Most likely next two</h2>`;
    if(top2.length===0){
      html += `<div style="color:var(--cream-dim);font-size:13px;padding:16px 0;">No active sets yet — add one below.</div>`;
    } else {
      html += `<div class="predict-grid">`;
      top2.forEach((x,i)=>{
        const p=x.p, s=x.s;
        html += `<div class="predict-card">
          <div class="predict-rank">Prediction ${i+1}</div>
          <div class="predict-name">${escapeHtml(s.name)}</div>
          <div class="predict-pct">${x.pct.toFixed(1)}<span> %</span></div>
          <div class="predict-meta">
            ${typeTag(p.type)} &nbsp; ${p.count} appearance${p.count!==1?'s':''} so far<br>
            Last seen: <b>${p.lastDate?fmtDisplay(p.lastDate):'—'}</b><br>
            Estimated next: <b>${fmtDisplay(p.predicted)}</b> (${overdueText(p.daysDiff)})
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    html += `<div class="section-head"><h2>Full active roster</h2><span class="hint">oldest release date first — click a name to view or edit its full history</span></div>`;
    html += `<table class="roster"><thead><tr>
      <th>Set</th><th>Type</th><th class="num">Appearances</th><th class="num">Last seen</th><th class="num">Est. next</th><th>Likelihood</th><th></th>
    </tr></thead><tbody>`;
    chronological.forEach(x=>{
      const p=x.p, s=x.s;
      html += `<tr>
        <td class="name" onclick="toggleEdit('${s.id}')">${escapeHtml(s.name)}</td>
        <td>
          <select class="type-select" onchange="setTypeOverride('${s.id}', this.value)">
            <option value="" ${!s.typeOverride?'selected':''}>auto (${p.type})</option>
            <option value="long" ${s.typeOverride==='long'?'selected':''}>long</option>
            <option value="short" ${s.typeOverride==='short'?'selected':''}>short</option>
          </select>
        </td>
        <td class="num">${p.count}</td>
        <td class="num">${p.lastDate?fmtDisplay(p.lastDate):'—'}</td>
        <td class="num">${fmtDisplay(p.predicted)}</td>
        <td><div class="pct-bar-wrap"><div class="pct-bar-track"><div class="pct-bar-fill" style="width:${clamp(x.pct*4,2,100)}%"></div></div><span class="pct-num">${x.pct.toFixed(1)}%</span></div></td>
        <td>
          <div class="roster-actions">
            <button onclick="toggleEdit('${s.id}')">${expandedId===s.id?'Close':'Edit'}</button>
            <button class="danger" onclick="retireSet('${s.id}')">Retire</button>
          </div>
        </td>
      </tr>
      ${expandedId===s.id ? `<tr><td colspan="7">${renderEditPanel(s)}</td></tr>` : ''}
      `;
    });
    html += `</tbody></table>`;

    html += `<div class="panel-box">
      <h3>Add a new set</h3>
      <div class="edit-row">
        <div class="field"><label>Name</label><input id="new-name" placeholder="e.g. Void Corrupted"></div>
        <div class="field"><label>Release date (added to game)</label><input id="new-added" type="date"></div>
        <div class="field"><label>First BLC appearance (optional)</label><input id="new-first" type="date"></div>
        <button class="primary" onclick="addSet()">Add set</button>
      </div>
      <div class="footnote">Leave "first appearance" blank if it hasn't debuted yet. You can add more appearance dates and edit everything afterward by clicking the set's name. Retired sets and their full history are on the Timeline tab.</div>
    </div>`;
  }

  html += `<div class="footnote" style="margin-top:24px;">
    Sets are classified long-cycle (~${Math.round(stats.longMean)}d between appearances) or short-cycle (~${Math.round(stats.shortMean)}d), recomputed live from current data, unless you set a manual override. Likelihood reflects how close the reference date is to each set's projected next appearance relative to normal variance for its type — it doesn't factor in how many times a set has already appeared toward its typical retirement, so use the appearance count to judge that yourself. Edits are saved automatically to this browser's local storage — they stay on this device/browser and won't follow you if you open the file elsewhere or clear browsing data.
  </div>`;

  document.getElementById('app').innerHTML = html;
}

function toggleEdit(id){ expandedId = (expandedId===id) ? null : id; render(); }
function closeEdit(){ expandedId = null; render(); }

async function setNextUpdate(val){
  state.nextUpdateDate = val || null;
  await saveState();
  render();
}
async function setTypeOverride(id, val){
  const s = state.sets.find(x=>x.id===id);
  if(!s) return;
  s.typeOverride = val || null;
  await saveState();
  render();
}
async function addAppearance(id){
  const s = state.sets.find(x=>x.id===id);
  if(!s) return;
  const val = document.getElementById('new-appearance-'+id).value;
  if(!val){ showStatus('Pick a date first.', true); return; }
  if(!s.appearances) s.appearances=[];
  if(!s.appearances.includes(val)) s.appearances.push(val);
  await saveState();
  render();
}
async function removeAppearance(id, dateStr){
  const s = state.sets.find(x=>x.id===id);
  if(!s) return;
  s.appearances = (s.appearances||[]).filter(d=>d!==dateStr);
  await saveState();
  render();
}
async function saveEdit(id){
  const s = state.sets.find(x=>x.id===id);
  if(!s) return;
  const name = document.getElementById('edit-name-'+id).value.trim();
  const added = document.getElementById('edit-added-'+id).value;
  const type = document.getElementById('edit-type-'+id).value;
  const retired = document.getElementById('edit-retired-'+id).value === 'true';
  if(!name || !added){ showStatus('Name and release date are required.', true); return; }
  s.name = name; s.added = added; s.typeOverride = type || null; s.retired = retired;
  await saveState();
  showStatus(`Saved ${name}.`, false);
  expandedId = null;
  render();
}
async function retireSet(id){
  const s = state.sets.find(x=>x.id===id);
  if(!s) return;
  s.retired = true;
  await saveState();
  showStatus(`${s.name} marked as retired.`, false);
  render();
}
async function deleteSet(id){
  state.sets = state.sets.filter(s=>s.id!==id);
  await saveState();
  expandedId = null;
  showStatus('Set deleted.', false);
  render();
}
async function addSet(){
  const name = document.getElementById('new-name').value.trim();
  const added = document.getElementById('new-added').value;
  const first = document.getElementById('new-first').value;
  if(!name || !added){ showStatus('Name and release date are required.', true); return; }
  if(state.sets.some(s=>s.name.toLowerCase()===name.toLowerCase())){ showStatus('A set with that name already exists.', true); return; }
  state.sets.push({ id: nextId(), name, added, appearances: first?[first]:[], retired:false, typeOverride:null });
  await saveState();
  showStatus(`Added ${name}.`, false);
  render();
}

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
